name: Store release
# Forgejo Actions. Publishing a release on git.borodutch.com builds, creates the GitHub release (releases don't
# mirror) and submits every enabled store. Play and Chrome authenticate with Google Workload Identity Federation,
# whose provider trusts this workflow's OIDC tokens on v* release events only.
on:
  release:
    types: [published]
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# One release at a time, across tags: stores have one editable submission slot.
concurrency:
  group: store-release-${{ github.event_name == 'release' && 'production' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }} # a newer push supersedes a PR run
jobs:
  build:
    if: github.event_name != 'release' || (!github.event.release.prerelease && !github.event.release.draft)
    # Our own pushes and PRs run on the Mac runners, where Node, the JDK, the SDK and Gradle's caches persist between
    # runs. Releases (whose artifact the store jobs take) and outsiders' PRs (bridged from GitHub by the `github` user)
    # run on Linux.
    runs-on: ${{ github.event_name != 'release' && (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude","radiant"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      # Releases: the whole history and tags (build.py checks the tag; the Firefox sources zip)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'release'
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Linux: one commit without the store screenshots and share images (~90 MB nothing here reads)
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name != 'release' && runner.os == 'Linux'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/appstore/screenshots/
            !/fastlane/metadata/android/*/images/
            !/docs/og/
      # Mac: the commit from a copy of the repository in the runner's tool cache, so a run downloads only its new
      # objects (a fresh checkout spends 5-20 s fetching files from the busy server). Without the store screenshots and
      # share images (~90 MB nothing here reads).
      - name: Checkout
        if: runner.os == 'macOS'
        run: |
          mirror="$RUNNER_TOOL_CACHE/plainwallet.git"
          [ -d "$mirror" ] || { git init -q --bare "$mirror" && git -C "$mirror" config gc.auto 0; }
          # A cancelled run can leave a lock behind (one job at a time per runner, so none is live); the server can drop
          # a busy connection, so the fetch gets three tries like actions/checkout's.
          for try in 1 2 3; do
            find "$mirror" -name '*.lock' -delete
            git -C "$mirror" fetch -q --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "+$GITHUB_SHA:refs/ci/head" && break
            [ $try -lt 3 ] || exit 1
          done
          cd "$GITHUB_WORKSPACE" && find . -mindepth 1 -delete && git init -q
          echo "$mirror/objects" > .git/objects/info/alternates && cp "$mirror/shallow" .git/shallow
          git config core.sparseCheckout true
          printf '%s\n' '/*' '!/appstore/screenshots/' '!/fastlane/metadata/android/*/images/' '!/docs/og/' > .git/info/sparse-checkout
          git -c advice.detachedHead=false checkout -q "$GITHUB_SHA"
      # Mac: Homebrew's Node (when it is the pinned version), a per-runner SDK (Gradle installs the platform and build
      # tools it needs), and a JDK and Gradle's own caches in the runner user's home, shared by the runners: one JDK path
      # lets every runner reuse the same Gradle daemon.
      - id: mac
        name: Mac toolchain
        if: runner.os == 'macOS'
        run: |
          sdk="${PWD%%/work/*}/android-sdk"
          [ -d "$sdk/licenses" ] || { mkdir -p "$sdk" && cp -R /opt/homebrew/share/android-commandlinetools/licenses "$sdk/"; }
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          # Temurin, pinned and checked: Homebrew's JDK can't load the user's private freetype.
          jdk="$HOME/temurin-21.0.13+9"
          if [ ! -x "$jdk/Contents/Home/bin/java" ]; then
            tmp="$jdk.$$" && rm -rf "$tmp" && mkdir -p "$tmp"
            curl -fsSL -o "$tmp/jdk.tgz" https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_aarch64_mac_hotspot_21.0.13_9.tar.gz
            echo "bf036b35b071bfb2f54f2c0af8ee8d88afa95ee6eb3dce02c0f94cfc2524d04a  $tmp/jdk.tgz" | shasum -a 256 -c
            tar -xzf "$tmp/jdk.tgz" -C "$tmp" --strip-components 1 && rm "$tmp/jdk.tgz"
            [ -e "$jdk" ] || mv "$tmp" "$jdk" # another runner may have installed it meanwhile
            rm -rf "$tmp"
          fi
          echo "JAVA_HOME=$jdk/Contents/Home" >> "$GITHUB_ENV"
          if [ "$(/opt/homebrew/bin/node --version)" = v26.8.2 ]; then echo /opt/homebrew/bin >> "$GITHUB_PATH"; echo node=brew >> "$GITHUB_OUTPUT"; fi
      # Linux pull requests and main restore Node, the JDK, the Android SDK and Gradle's dependencies instead of
      # downloading them (Gradle still checks every dependency against verification-metadata.xml). Releases start from nothing.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name != 'release' && runner.os == 'Linux'
        with:
          path: |
            /opt/hostedtoolcache/node
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk
            /root/.android/sdk/*
            !/root/.android/sdk/cmdline-tools
            /root/.gradle/wrapper/dists/*/*/*
            !/root/.gradle/wrapper/dists/*/*/*.zip
            ~/.gradle/caches/modules-2
          key: build-${{ hashFiles('package-lock.json', 'android/**/*.kts', 'android/gradle/**') }}
          restore-keys: build-
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.mac.outputs.node != 'brew'
        with:
          node-version: '26.8.2'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: runner.os == 'Linux'
        with:
          distribution: temurin
          java-version: '21'
      # A restored SDK has its licenses, platform and build tools (Gradle installs those it misses), so it needs no sdkmanager.
      - id: sdk
        if: runner.os == 'Linux'
        run: test -d ~/.android/sdk/licenses && echo "ANDROID_HOME=$HOME/.android/sdk" >> "$GITHUB_ENV" || echo missing=1 >> "$GITHUB_OUTPUT"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        if: steps.sdk.outputs.missing
        with:
          packages: platform-tools
      # Pull requests and main: every test, and compile checks of the extension (Chrome, Firefox, the Android page),
      # the types and both Android flavors, side by side. The store builds (R8, AAB, APK) run on releases only.
      - name: Tests and compile checks
        if: github.event_name != 'release'
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            # node_modules for this lockfile and Node, kept in the runner's tool cache and linked in (npm ci: ~25 s)
            modules="$RUNNER_TOOL_CACHE/plainwallet-npm/$(cat package-lock.json .npmrc <(node --version) | shasum -a 256 | cut -c1-16)/node_modules"
            if [ ! -d "$modules" ]; then
              npm ci --no-audit --no-fund
              rm -rf "$RUNNER_TOOL_CACHE/plainwallet-npm" && mkdir -p "${modules%/*}" && mv node_modules "$modules"
            fi
            ln -s "$modules" node_modules
          else
            npm ci
          fi
          # The generated types, written once here so the parallel builds find them current and never rewrite them
          npm exec -- wxt prepare
          logs="${RUNNER_TEMP:-/tmp}/checks" && rm -rf "$logs" && mkdir -p "$logs"
          lanes=()
          lane() { "${@:2}" > "$logs/$1.log" 2>&1 & lanes+=("$! $1"); }
          lane js-tests npm test
          for t in scripts/release/test_*.py; do lane "${t##*/}" python3 -m unittest discover -s scripts/release -p "${t##*/}"; done
          lane chrome npm run build
          lane firefox npm exec -- wxt build -b firefox --mv3
          lane android-page npm run build:android
          lane types npm exec -- tsc --noEmit
          # The daemon outlives the job on the Mac (warm: ~3 s instead of ~25 s), but not for hours. Without file system
          # watching it never trusts what it saw of an earlier job's checkout. The test task always runs, never taken
          # from the build cache.
          lane android sh -c 'cd android && exec ./gradlew -Dorg.gradle.daemon.idletimeout=900000 --no-watch-fs --build-cache -PprebuiltWeb --dependency-verification strict testPlayDebugUnitTest --rerun compileFdroidDebugJavaWithJavac'
          failed=
          for l in "${lanes[@]}"; do
            set -- $l
            if wait "$1"; then echo "::group::$2 ok"; else failed="$failed $2"; echo "::group::$2 FAILED"; fi
            cat "$logs/$2.log"
            echo ::endgroup::
          done
          test -z "$failed" || { echo "::error::Failed:$failed"; exit 1; }
      - name: Credential-free tests and builds
        if: github.event_name == 'release'
        run: |
          npm ci
          # The tests only read the sources, so they run alongside the builds.
          (python3 -m unittest discover -s scripts/release -p 'test_*.py' && npm test) > tests.log 2>&1 &
          tests=$!
          npm run build
          npm exec -- tsc --noEmit
          npm exec -- wxt build -b firefox --mv3
          cd android
          ./gradlew --no-daemon --dependency-verification strict bundlePlayRelease assembleFdroidRelease testPlayDebugUnitTest
          wait $tests && cat ../tests.log || { cat ../tests.log; exit 1; }
      - name: Bind package, manifests and AAB to immutable release
        if: github.event_name == 'release'
        run: python3 scripts/release/build.py ci
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: github.event_name == 'release' # only the store submissions use it
        with:
          name: unsigned-release
          path: release-out/
          if-no-files-found: error
          retention-days: 30
  # Compile checks of the iOS app with its tests and of the Mac app with its Safari extension. The iOS tests run
  # locally (simulator runs would hold up the shared Mac); the archives are built on releases only, by submit-apple.
  build-apple:
    if: github.event_name != 'release' && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'backmeupplz')
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      # Mac: the commit from a copy of the repository in the runner's tool cache, so a run downloads only its new
      # objects (a fresh checkout spends 5-20 s fetching files from the busy server). Without the store screenshots and
      # share images (~90 MB nothing here reads).
      - name: Checkout
        run: |
          mirror="$RUNNER_TOOL_CACHE/plainwallet.git"
          [ -d "$mirror" ] || { git init -q --bare "$mirror" && git -C "$mirror" config gc.auto 0; }
          # A cancelled run can leave a lock behind (one job at a time per runner, so none is live); the server can drop
          # a busy connection, so the fetch gets three tries like actions/checkout's.
          for try in 1 2 3; do
            find "$mirror" -name '*.lock' -delete
            git -C "$mirror" fetch -q --no-tags --depth=1 "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "+$GITHUB_SHA:refs/ci/head" && break
            [ $try -lt 3 ] || exit 1
          done
          cd "$GITHUB_WORKSPACE" && find . -mindepth 1 -delete && git init -q
          echo "$mirror/objects" > .git/objects/info/alternates && cp "$mirror/shallow" .git/shallow
          git config core.sparseCheckout true
          printf '%s\n' '/*' '!/appstore/screenshots/' '!/fastlane/metadata/android/*/images/' '!/docs/og/' > .git/info/sparse-checkout
          git -c advice.detachedHead=false checkout -q "$GITHUB_SHA"
      # Compiling only needs the apps' web folders to exist (the archives fill them). The sources are copied by content
      # to a fixed folder in the runner's tool cache, next to DerivedData: unchanged files keep their dates, so Xcode
      # compiles only what changed (~5 s instead of ~60 s). xcodebuild gets a clean environment since it reads every
      # variable as a build setting, except DEVELOPER_DIR, which picks the same Xcode as the archives.
      - name: iOS and Mac compile checks
        run: |
          cache="$RUNNER_TOOL_CACHE/plainwallet-xcode"
          mkdir -p ios/web macos/web macos/safari "$cache/src"
          rsync -rc --delete ios macos "$cache/src/"
          cd "$cache/src"
          xcode() {
            env -i HOME="$HOME" PATH="$PATH" TMPDIR="${TMPDIR:-/tmp}" ${DEVELOPER_DIR:+DEVELOPER_DIR="$DEVELOPER_DIR"} \
              xcodebuild -quiet -scheme PlainWallet CODE_SIGNING_ALLOWED=NO -derivedDataPath "$cache/$1" \
              -project "$1/PlainWallet.xcodeproj" "${@:2}" > "$1.log" 2>&1
          }
          xcode ios -destination 'generic/platform=iOS Simulator' build-for-testing & ios=$!
          xcode macos -destination 'generic/platform=macOS' build & mac=$!
          failed=
          wait $ios || failed="$failed ios"
          wait $mac || failed="$failed macos"
          cat ios.log macos.log
          test -z "$failed" || { echo "::error::Failed:$failed"; exit 1; }
  select-stores:
    if: github.repository == 'backmeupplz/plainwallet' && github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      stores: ${{ steps.select.outputs.stores }}
      has_stores: ${{ steps.select.outputs.has_stores }}
      appstore: ${{ steps.select.outputs.appstore }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/release
      - id: select
        name: Select enabled stores without store credentials
        env:
          STORE_CHROME_PAUSED: ${{ vars.STORE_CHROME_PAUSED }}
          STORE_FIREFOX_PAUSED: ${{ vars.STORE_FIREFOX_PAUSED }}
          STORE_PLAY_PAUSED: ${{ vars.STORE_PLAY_PAUSED }}
          STORE_APK_PAUSED: ${{ vars.STORE_APK_PAUSED }}
          STORE_FDROID_PAUSED: ${{ vars.STORE_FDROID_PAUSED }}
          STORE_APPSTORE_PAUSED: ${{ vars.STORE_APPSTORE_PAUSED }}
        run: python3 scripts/release/stores.py
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: selection-outcomes-${{ github.run_attempt }}
          path: selection-outcomes/
          if-no-files-found: ignore
          retention-days: 90
  # The submission journal and the APKs live on the GitHub release, where the README, the site and F-Droid download
  # them.
  github-release:
    if: github.repository == 'backmeupplz/plainwallet' && github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish the same release on GitHub once the tag has mirrored
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name }}
          TITLE: ${{ github.event.release.name }}
          NOTES: ${{ github.event.release.body }}
          SHA: ${{ github.sha }}
        run: |
          for _ in $(seq 30); do
            test "$(gh api "repos/$REPO/commits/$TAG" --jq .sha 2>/dev/null)" = "$SHA" && break
            sleep 10
          done
          test "$(gh api "repos/$REPO/commits/$TAG" --jq .sha)" = "$SHA" || { echo "GitHub tag $TAG is not at $SHA; check the push mirror"; exit 1; }
          gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1 || gh release create "$TAG" --repo "$REPO" --verify-tag --title "${TITLE:-$TAG}" --notes "$NOTES"
  submit:
    if: needs.select-stores.outputs.has_stores == 'true'
    needs: [build, select-stores, github-release]
    strategy:
      fail-fast: false
      matrix:
        store: ${{ fromJSON(needs.select-stores.outputs.stores) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # Play's job also sends every language's listing images
    permissions:
      contents: write # APK copies on the Forgejo release; the journal is on the GitHub release (GH_MIRROR_TOKEN)
    enable-openid-connect: true # short-lived Google credentials; the provider admits only v* release runs of this workflow
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # the release notes in every language (fastlane/metadata/android/*/changelogs) go to Play
          sparse-checkout: |
            scripts/release
            fastlane/metadata/android
      - uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: unsigned-release
          path: release-out
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        if: matrix.store == 'play' || matrix.store == 'apk'
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        if: matrix.store == 'apk'
        with:
          packages: build-tools;36.0.0
      - name: Verify setup gates before authentication
        env:
          CONFIRMED: ${{ vars.STORE_SETUP_CONFIRMED }}
          AUTO_PUBLISH_APPROVED: ${{ vars.STORE_AUTO_PUBLISH_APPROVED }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_MANAGED_PUBLISHING_DISABLED_CONFIRMED: ${{ vars.PLAY_MANAGED_PUBLISHING_DISABLED_CONFIRMED }}
          PLAY_MANAGED_PUBLISHING_CONFIRMED: ${{ vars.PLAY_MANAGED_PUBLISHING_CONFIRMED }}
          AMO_AUTO_PUBLISH_APPROVED: ${{ vars.AMO_AUTO_PUBLISH_APPROVED }}
          WIF_PROVIDER: ${{ vars.GOOGLE_WIF_PROVIDER }}
          SERVICE_ACCOUNT: ${{ matrix.store == 'play' && vars.PLAY_GOOGLE_SERVICE_ACCOUNT || vars.CHROME_GOOGLE_SERVICE_ACCOUNT }}
          STORE: ${{ matrix.store }}
        run: |
          test "$CONFIRMED" = true || { echo 'Configure store variables; see docs/STORE_RELEASE.md'; exit 1; }
          test "$AUTO_PUBLISH_APPROVED" = true || { echo 'Owner must confirm automatic public publication after approval'; exit 1; }
          if [ "$STORE" = play ]; then
            test "$PLAY_TRACK" = production && test "$PLAY_MANAGED_PUBLISHING_DISABLED_CONFIRMED" = true && test "$PLAY_MANAGED_PUBLISHING_CONFIRMED" != true || { echo 'Play requires production and managed publishing disabled; remove obsolete enabled confirmation'; exit 1; }
          elif [ "$STORE" = firefox ]; then
            test "$AMO_AUTO_PUBLISH_APPROVED" = true || { echo 'Owner must approve AMO listed automatic publication'; exit 1; }
          fi
          if [ "$STORE" = chrome ] || [ "$STORE" = play ]; then
            test -n "$WIF_PROVIDER" && test -n "$SERVICE_ACCOUNT"
          fi
      - id: google
        if: matrix.store == 'chrome' || matrix.store == 'play'
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193 # v2.1.10
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WIF_PROVIDER }}
          service_account: ${{ matrix.store == 'play' && vars.PLAY_GOOGLE_SERVICE_ACCOUNT || vars.CHROME_GOOGLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: ${{ matrix.store == 'play' && 'https://www.googleapis.com/auth/androidpublisher' || 'https://www.googleapis.com/auth/chromewebstore' }}
          create_credentials_file: false
          export_environment_variables: false
      - name: Sign only with JDK, request review and automatic publication
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          STORE_SETUP_CONFIRMED: ${{ vars.STORE_SETUP_CONFIRMED }}
          STORE_AUTO_PUBLISH_APPROVED: ${{ vars.STORE_AUTO_PUBLISH_APPROVED }}
          PLAY_MANAGED_PUBLISHING_DISABLED_CONFIRMED: ${{ vars.PLAY_MANAGED_PUBLISHING_DISABLED_CONFIRMED }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_ITEM_ID: ${{ vars.CHROME_ITEM_ID }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_MANAGED_PUBLISHING_CONFIRMED: ${{ vars.PLAY_MANAGED_PUBLISHING_CONFIRMED }}
          PLAY_APP_SIGNING_CONFIRMED: ${{ vars.PLAY_APP_SIGNING_CONFIRMED }}
          ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          AMO_ADDON_ID: ${{ vars.AMO_ADDON_ID }}
          AMO_AUTO_PUBLISH_APPROVED: ${{ vars.AMO_AUTO_PUBLISH_APPROVED }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          FDROID_MR: ${{ vars.FDROID_MR }}
          FDROID_APP_ID: com.borodutch.plainwallet
          FDROID_FORK: backmeupplz/fdroiddata
          FDROID_BRANCH: com.borodutch.plainwallet
          FDROID_GRADLE: fdroid # the flavor build.py takes the release APK from (assembleFdroidRelease)
          STORE: ${{ matrix.store }}
        run: python3 scripts/release/submit.py "$STORE"
      - name: Copy the signed APKs to the Forgejo release
        if: matrix.store == 'apk'
        env:
          TOKEN: ${{ github.token }}
          ASSETS: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets
          DOWNLOAD: https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          existing=$(curl -fsS -H "Authorization: token $TOKEN" "$ASSETS" | jq -r '.[].name')
          for name in "plainwallet-${TAG#v}-android.apk" plainwallet.apk; do
            grep -qxF "$name" <<<"$existing" && continue
            curl -fsSL -o "$name" "$DOWNLOAD/$name"
            curl -fsS -H "Authorization: token $TOKEN" -F "attachment=@$name" "$ASSETS?name=$name" >/dev/null
          done
      - name: Record early submission failure without credentials
        if: always()
        env:
          STORE: ${{ matrix.store }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("outcome.json")
          if not p.exists():
              p.write_text(json.dumps({"store": os.environ["STORE"], "state": "failed", "error": "Submission job did not reach outcome; inspect setup/authentication/build artifact steps"}) + "\n")
          PY
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: outcome-${{ matrix.store }}-${{ github.run_attempt }}
          path: outcome.json
          if-no-files-found: warn
          retention-days: 90
  # Release only. Builds the archives credential-free (no secrets in those steps), then submits; the App Store key
  # exists only in the submission step.
  submit-apple:
    if: needs.select-stores.outputs.appstore == 'true'
    needs: [build, select-stores, github-release]
    runs-on: macos-26
    timeout-minutes: 180
    permissions:
      contents: read # the journal is on the GitHub release (GH_MIRROR_TOKEN)
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '26.8.2'
      - name: Credential-free iOS and Mac archives
        run: |
          npm ci
          npm run build:macos
          rm -rf ios/web && cp -R .output/android-mv3 ios/web
          python3 scripts/release/build.py apple
      - uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          name: unsigned-release
          path: release-out
      - name: Verify setup gates before using the key
        env:
          CONFIRMED: ${{ vars.STORE_SETUP_CONFIRMED }}
          AUTO_PUBLISH_APPROVED: ${{ vars.STORE_AUTO_PUBLISH_APPROVED }}
        run: |
          test "$CONFIRMED" = true || { echo 'Configure store variables; see docs/STORE_RELEASE.md'; exit 1; }
          test "$AUTO_PUBLISH_APPROVED" = true || { echo 'Owner must confirm automatic public publication after approval'; exit 1; }
      - name: Cloud-sign and upload with Apple's tools, replace older reviews, request review and automatic release
        env:
          GH_TOKEN: ${{ secrets.GH_MIRROR_TOKEN }}
          STORE_SETUP_CONFIRMED: ${{ vars.STORE_SETUP_CONFIRMED }}
          STORE_AUTO_PUBLISH_APPROVED: ${{ vars.STORE_AUTO_PUBLISH_APPROVED }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: 3FT23S9NSM
          ASC_ISSUER_ID: a18f42ff-6c44-410c-badf-50b11de8dbb8
        run: python3 scripts/release/submit.py appstore
      - name: Record early submission failure without credentials
        if: always()
        env:
          STORE: appstore
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path("outcome.json")
          if not p.exists():
              p.write_text(json.dumps({"store": os.environ["STORE"], "state": "failed", "error": "Submission job did not reach outcome; inspect setup/authentication/build artifact steps"}) + "\n")
          PY
      - uses: https://code.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: outcome-appstore-${{ github.run_attempt }}
          path: outcome.json
          if-no-files-found: warn
          retention-days: 90
  report:
    if: always() && github.repository == 'backmeupplz/plainwallet' && github.event_name == 'release' && !github.event.release.prerelease && !github.event.release.draft
    needs: [build, select-stores, github-release, submit, submit-apple]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: scripts/release
      - uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        with:
          pattern: outcome-*
          path: outcomes
      - uses: https://code.forgejo.org/forgejo/download-artifact@d8d0a99033603453ad2255e58720b460a0555e1e # v4
        if: always()
        with:
          pattern: selection-outcomes-*
          path: outcomes
          merge-multiple: true
      - name: Summarize independent per-store outcomes
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: python3 scripts/release/report.py
