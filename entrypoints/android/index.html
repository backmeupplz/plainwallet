<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="wxt.include" content="['android']" />
    <!-- As strict as the extension's own pages: only this page's scripts; network only to https (RPCs, lookups, Jev) -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https:; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'" />
    <title>Plain Wallet</title>
    <!-- no favicon.ico in the app: an empty icon keeps the WebView from asking for one -->
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="../popup/style.css" />
    <!-- a classic script, so it runs before the modules that look for the browser API it provides -->
    <script src="/android-shim.js"></script>
  </head>
  <body class="app">
    <main id="app"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
